name: Assistant VTherm
version: "0.1.2"
slug: vtherm_assistant
description: Assistant de diagnostic VTherm en lecture seule
url: https://github.com/jmcollin78/vtherm_assistant
image: ghcr.io/jmcollin78/vtherm-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
stage: experimental
ingress: true
ingress_port: 8099
panel_admin: true
panel_title: Assistant VTherm
panel_icon: mdi:thermostat
homeassistant_api: true
backup: cold
environment:
  VTHERM_DEPLOYMENT_MODE: ingress
  VTHERM_DATA_DIR: /data/vtherm-assistant
options:
  ha_internal_url: http://homeassistant:8123
schema:
  ha_internal_url: url
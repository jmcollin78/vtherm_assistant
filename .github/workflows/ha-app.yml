name: HA app - verify and prepare

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VTHERM_TEST_IMAGE: vtherm-assistant:ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install pip==26.2.2
          python -m pip install --constraint requirements-ha.lock --build-constraint requirements-ha.lock '.[test]'
          python -m playwright install --with-deps chromium
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate GitHub Actions workflow
        run: docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 .github/workflows/ha-app.yml
      - name: Build both architectures from source root
        run: docker buildx build --platform linux/arm64,linux/amd64 --load -t vtherm-assistant:ci .
      - name: Test application and both images
        run: |
          python -m pytest -q --ignore=tests/test_frontend.py --ignore=tests/test_packaging.py
          python -m pytest -q tests/test_frontend.py tests/test_packaging.py
      - name: Prepare unpublished catalogue
        run: python scripts/package_ha_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: ha-app-unpublished
          path: dist/ha-app/
          retention-days: 7
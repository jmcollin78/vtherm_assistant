[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtherm-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "google-adk>=2.13,<3",
    "uvicorn>=0.30,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.package-data]
vtherm_assistant = ["frontend/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
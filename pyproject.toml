[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtherm-assistant"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9,<2",
    "fastapi>=0.115,<1",
    "google-adk>=2.13,<3",
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
    "litellm>=1.84,<1.106.0",
    "mcp>=1.9,<2",
    "uvicorn>=0.30,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-playwright>=0.7,<1", "PyYAML>=6,<7"]
dev = ["vtherm-assistant[test]"]

[tool.setuptools.package-data]
vtherm_assistant = ["frontend/*.html", "frontend/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]